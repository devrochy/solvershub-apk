name: build-and-test

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  build-and-test:
    # Runner self-hosted (Linux Mint): los minutos hospedados estan bloqueados por
    # facturacion en la cuenta; ademas se evita ejecutar PRs de forks en el runner.
    runs-on: [self-hosted, linux, x64]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --silent

      - name: Typecheck
        run: npm run typecheck --silent

      - name: Test
        run: npm test -- --silent

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}