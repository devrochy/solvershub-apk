name: build-and-test

on:
  pull_request:
  push:
    branches: [develop]

# Una corrida por ref: evita encolar dos jobs en el runner self-hosted (único).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Runner self-hosted (Linux Mint): los minutos hospedados estan bloqueados por
    # facturacion en la cuenta; ademas se evita ejecutar PRs de forks en el runner.
    runs-on: [self-hosted, linux, x64]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --silent

      - name: Typecheck
        run: npm run typecheck --silent

      - name: Test
        run: npm test -- --silent

      - name: Gitleaks (secret scan)
        # Binario fijado descargado a $RUNNER_TEMP (directorio del runner): evita
        # el caché y el /tmp que dejaba trabado a `gitleaks-action`.
        run: |
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" detect --source . --redact -v
