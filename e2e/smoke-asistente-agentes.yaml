# Smoke de Nuevo agente en 5 estaciones (HU-APP-23, SPEC-49): se abre a pantalla completa con ✕ y «Nuevo
# agente · 1 de 5», con el tipo recomendado preelegido, su guion y su nombre sugerido. Cambia una opción, vuelve
# a lo recomendado y cierra con ✕ SIN crear el agente (no escribe datos en test). Requiere un APK/OTA con
# HU-APP-23 y el backend con `/admin/agents/from-script`. Credenciales demo: demo12345.
appId: com.solvershub.apk
---
- launchApp
- assertVisible: "SolversHub"
- tapOn:
    id: "login-usuario"
- inputText: "dueno-a@demo.test"
- tapOn:
    id: "login-password"
- inputText: "demo12345"
- tapOn:
    id: "login-entrar"
- extendedWaitUntil:
    visible: "Cobranza Demo"
    timeout: 30000
- tapOn: "Cobranza Demo"
- extendedWaitUntil:
    visible:
      id: "panel-menu"
    timeout: 20000
- tapOn:
    id: "panel-menu"
- scrollUntilVisible:
    element:
      id: "cajon-item-agentes"
    direction: DOWN
- tapOn:
    id: "cajon-item-agentes"
- extendedWaitUntil:
    visible:
      id: "agentes-lista"
    timeout: 20000
- tapOn:
    id: "agentes-nuevo"
- extendedWaitUntil:
    visible:
      id: "asistente-escenario"
    timeout: 20000
- assertVisible: "Nuevo agente · 1 de 5"
- assertVisible: "Paso 1 de 5 · Tipo"
- assertVisible: "¿Qué quieres que haga tu agente?"
- assertVisible: "Recomendado"
# El botón dice a quién crea (el nombre sugerido del tipo recomendado).
- assertVisible: "Crear a .* y seguir"
# Cambiar el nombre cuenta un cambio; «Usar lo recomendado» vuelve atrás.
- tapOn:
    id: "asistente-nombre"
- inputText: "Prueba"
- hideKeyboard
- assertVisible: ".*1 cambio.*"
- tapOn:
    id: "asistente-recomendado-usar"
- assertNotVisible: "Usar lo recomendado"
# ✕ cierra sin crear nada.
- tapOn:
    id: "asistente-escenario-cerrar"
- assertVisible:
    id: "agentes-lista"
