# Smoke del panel en la app oficial (dueño): secciones del cierre de réplica.
# Contra el APK preview + API de test. Credenciales: demo12345.
# Requiere instalación limpia (sin sesión previa). Las escrituras guardan los
# valores tal como llegan (no cambian datos) y corren comprobaciones de Meta.
# Navegación (HU-DS-11, D-34; menú v2, HU-UX-11): header con hamburguesa
# (`panel-menu`) y cajón lateral con grupos (`cajon-grupo-<id>`) y una fila por
# entrada (`cajon-item-<id>`), que abre su primera pestaña permitida. La
# pantalla muestra solo las pestañas de esa entrada (Equipo → Colaboradores) y
# esconde la barra si queda una sola; las demás se tocan dentro de la pantalla.
appId: com.solvershub.apk
---
- launchApp
- assertVisible: "SolversHub"
# 1. Login del dueño → selector de negocio
- tapOn:
    id: "login-usuario"
- inputText: "dueno-a@demo.test"
- tapOn:
    id: "login-password"
- inputText: "demo12345"
- tapOn:
    id: "login-entrar"
- assertVisible: "Elige tu negocio"
# La lista de negocios llega por red (spinner mientras tanto).
- extendedWaitUntil:
    visible: "Cobranza Demo"
    timeout: 30000
- tapOn: "Cobranza Demo"
# Shell del panel: header con la hamburguesa.
- extendedWaitUntil:
    visible:
      id: "panel-menu"
    timeout: 20000
# 2. Cobranza → área Equipo → Gestores (solo lectura). Cobranza va por áreas
#    (HU-UX-12): fila 1 `cobranza-area-<area>`, fila 2 `cobranza-<seccion>`.
- tapOn:
    id: "panel-menu"
- assertVisible:
    id: "cajon-marca"
- assertVisible:
    id: "cajon-cuenta"
# Los grupos arrancan plegados: abrir Negocio antes de buscar Cobranza.
- scrollUntilVisible:
    element:
      id: "cajon-grupo-negocio"
    direction: DOWN
- tapOn:
    id: "cajon-grupo-negocio"
- scrollUntilVisible:
    element:
      id: "cajon-item-cobranza"
    direction: DOWN
- tapOn:
    id: "cajon-item-cobranza"
- extendedWaitUntil:
    visible:
      id: "cobranza-pestanas"
    timeout: 20000
- tapOn:
    id: "cobranza-area-equipo"
- tapOn:
    id: "cobranza-gestores"
- extendedWaitUntil:
    visible:
      id: "gestores-lista"
    timeout: 20000
- tapOn: "Gestor Demo"
- assertVisible:
    id: "permiso-generar_reporte"
- tapOn: "Cancelar"
# 3. Ventas → Resumen con KPIs (su primera pestaña)
#    Negocio sigue abierto porque Cobranza (la sección activa) vive en ese grupo.
- tapOn:
    id: "panel-menu"
- scrollUntilVisible:
    element:
      id: "cajon-item-ventas"
    direction: DOWN
- tapOn:
    id: "cajon-item-ventas"
- extendedWaitUntil:
    visible:
      id: "comercio-kpi-.*"
    timeout: 20000
# 4. Agenda → Horario (guardar sin cambios) y Google Calendar, como pestañas de la entrada
#    Negocio sigue abierto porque Ventas (la sección activa) vive en ese grupo.
- tapOn:
    id: "panel-menu"
- scrollUntilVisible:
    element:
      id: "cajon-item-agenda"
    direction: DOWN
- tapOn:
    id: "cajon-item-agenda"
- extendedWaitUntil:
    visible:
      id: "calendario-horario"
    timeout: 20000
- tapOn:
    id: "calendario-horario"
- extendedWaitUntil:
    visible:
      id: "horario-inicio-mon"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "horario-guardar"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "horario-guardar"
- extendedWaitUntil:
    visible:
      id: "horario-mensaje"
    timeout: 15000
- tapOn:
    id: "calendario-conexion"
- extendedWaitUntil:
    visible:
      id: "conexion-tarjeta"
    timeout: 20000
# 5. Configuración → General (guardar identidad sin cambios); es su primera pestaña.
#    Solo con las pestañas de la entrada: sin Colaboradores (es de Equipo).
- tapOn:
    id: "panel-menu"
- scrollUntilVisible:
    element:
      id: "cajon-grupo-cuenta"
    direction: DOWN
- tapOn:
    id: "cajon-grupo-cuenta"
- scrollUntilVisible:
    element:
      id: "cajon-item-configuracion"
    direction: DOWN
- tapOn:
    id: "cajon-item-configuracion"
- extendedWaitUntil:
    visible:
      id: "ajustes-identidad"
    timeout: 20000
- assertVisible:
    id: "config-fallos"
- assertNotVisible:
    id: "config-colaboradores"
- scrollUntilVisible:
    element:
      id: "ajustes-guardar"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "ajustes-guardar"
- extendedWaitUntil:
    visible:
      id: "ajustes-mensaje"
    timeout: 15000
# 6. Conexiones → Meta → Producción: correr comprobaciones (entrada propia en el menú v2,
#    con una sola pestaña: sin barra de pestañas de Configuración)
- tapOn:
    id: "panel-menu"
- scrollUntilVisible:
    element:
      id: "cajon-grupo-asistente"
    direction: DOWN
- tapOn:
    id: "cajon-grupo-asistente"
- scrollUntilVisible:
    element:
      id: "cajon-item-conexiones"
    direction: DOWN
- tapOn:
    id: "cajon-item-conexiones"
- extendedWaitUntil:
    visible:
      id: "subconex-meta"
    timeout: 20000
- assertNotVisible:
    id: "config-ajustes"
- tapOn:
    id: "subconex-meta"
- extendedWaitUntil:
    visible:
      id: "checklist-meta"
    timeout: 20000
- tapOn:
    id: "checklist-sub-production"
- tapOn:
    id: "checklist-correr"
- extendedWaitUntil:
    visible:
      id: "checklist-checks"
    timeout: 30000
# 7. Tema: vive en la tarjeta de la cuenta del cajón.
- tapOn:
    id: "panel-menu"
- tapOn:
    id: "cajon-cuenta"
- tapOn:
    id: "cajon-tema"
- assertVisible:
    id: "cajon-cuenta-submenu"
- tapOn:
    id: "cajon-tema"
# 8. Perfil: ruta real del stack; el gesto de volver se prueba a mano.
- tapOn:
    id: "cajon-perfil"
- extendedWaitUntil:
    visible:
      id: "perfil-admin"
    timeout: 20000
- back
- extendedWaitUntil:
    visible:
      id: "panel-menu"
    timeout: 10000
