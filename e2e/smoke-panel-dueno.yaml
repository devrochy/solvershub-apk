# Smoke del panel en la app oficial (dueño): secciones del cierre de réplica.
# Contra el APK preview + API de test. Credenciales: demo12345.
# Requiere instalación limpia (sin sesión previa). Las escrituras guardan los
# valores tal como llegan (no cambian datos) y corren comprobaciones de Meta.
# Navegación (HU-DS-11, D-34): header con hamburguesa (`panel-menu`) y cajón
# lateral con grupos (`cajon-grupo-<id>`) e ítems (`cajon-item-<modulo>-<pestana>`).
appId: com.solvershub.apk
---
- launchApp
- assertVisible: "SolversHub"
# 1. Login del dueño → selector de negocio
- tapOn:
    id: "login-usuario"
- inputText: "dueno-a@demo.test"
- tapOn:
    id: "login-password"
- inputText: "demo12345"
- tapOn:
    id: "login-entrar"
- assertVisible: "Elige tu negocio"
# La lista de negocios llega por red (spinner mientras tanto).
- extendedWaitUntil:
    visible: "Cobranza Demo"
    timeout: 30000
- tapOn: "Cobranza Demo"
# Shell del panel: header con la hamburguesa.
- extendedWaitUntil:
    visible:
      id: "panel-menu"
    timeout: 20000
# 2. Cobranza → Gestores (solo lectura) y Propietario. Los packs arrancan plegados.
- tapOn:
    id: "panel-menu"
- tapOn:
    id: "cajon-grupo-pack_cobranza"
- scrollUntilVisible:
    element:
      id: "cajon-item-cobranza-gestores"
    direction: DOWN
- tapOn:
    id: "cajon-item-cobranza-gestores"
- extendedWaitUntil:
    visible:
      id: "gestores-lista"
    timeout: 20000
- tapOn: "Gestor Demo"
- assertVisible:
    id: "permiso-generar_reporte"
- tapOn: "Cancelar"
# El grupo sigue desplegado (estado del cajón).
- tapOn:
    id: "panel-menu"
- scrollUntilVisible:
    element:
      id: "cajon-item-cobranza-propietario"
    direction: DOWN
- tapOn:
    id: "cajon-item-cobranza-propietario"
- extendedWaitUntil:
    visible:
      id: "propietario-contenedor"
    timeout: 20000
# 3. Comercio → Resumen con KPIs
- tapOn:
    id: "panel-menu"
- tapOn:
    id: "cajon-grupo-pack_commerce"
- tapOn:
    id: "cajon-item-comercio-resumen"
- extendedWaitUntil:
    visible:
      id: "comercio-kpi-.*"
    timeout: 20000
# 4. Calendario → Horario (guardar sin cambios) y Conexión, directo desde el cajón
- tapOn:
    id: "panel-menu"
- tapOn:
    id: "cajon-grupo-pack_calendar"
- tapOn:
    id: "cajon-item-calendario-horario"
- extendedWaitUntil:
    visible:
      id: "horario-inicio-mon"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "horario-guardar"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "horario-guardar"
- extendedWaitUntil:
    visible:
      id: "horario-mensaje"
    timeout: 15000
- tapOn:
    id: "panel-menu"
- tapOn:
    id: "cajon-item-calendario-conexion"
- extendedWaitUntil:
    visible:
      id: "conexion-tarjeta"
    timeout: 20000
# 5. Configuración → Ajustes (guardar identidad sin cambios)
- tapOn:
    id: "panel-menu"
- scrollUntilVisible:
    element:
      id: "cajon-item-configuracion-ajustes"
    direction: DOWN
- tapOn:
    id: "cajon-item-configuracion-ajustes"
- extendedWaitUntil:
    visible:
      id: "ajustes-identidad"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "ajustes-guardar"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "ajustes-guardar"
- extendedWaitUntil:
    visible:
      id: "ajustes-mensaje"
    timeout: 15000
# 6. Conexiones → Meta → Producción: correr comprobaciones (pestaña interna, como hoy)
- tapOn:
    id: "config-conexiones"
- tapOn:
    id: "subconex-meta"
- extendedWaitUntil:
    visible:
      id: "checklist-meta"
    timeout: 20000
- tapOn:
    id: "checklist-sub-production"
- tapOn:
    id: "checklist-correr"
- extendedWaitUntil:
    visible:
      id: "checklist-checks"
    timeout: 30000
# 7. Tema: el toggle del header alterna (oscuro por defecto → claro) y vuelve
- tapOn:
    id: "panel-tema"
- assertVisible:
    id: "panel-tema"
- tapOn:
    id: "panel-tema"
