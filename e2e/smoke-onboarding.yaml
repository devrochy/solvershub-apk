# Smoke de los primeros pasos (HU-APP-22, SPEC-41): un dueño de un negocio NUEVO ve el asistente abrirse
# solo, lo omite y queda el aviso fijo; lo retoma desde el aviso. No crea el agente (no escribe datos de
# agente en test). Requiere un APK/OTA con el módulo onboarding, el backend con `/admin/onboarding` y un
# negocio creado después de ONBOARDING_DESDE. Credenciales demo: demo12345.
appId: com.solvershub.apk
---
- launchApp
- assertVisible: "SolversHub"
- tapOn:
    id: "login-usuario"
- inputText: "dueno-nuevo@demo.test"
- tapOn:
    id: "login-password"
- inputText: "demo12345"
- tapOn:
    id: "login-entrar"
# Se abre solo, con el logo y el paso 1.
- extendedWaitUntil:
    visible:
      id: "onboarding-recorrido"
    timeout: 30000
- assertVisible:
    id: "logo-horizontal"
- assertVisible: "Paso 1 de 6"
# Sin elegir tipo no avanza.
- tapOn:
    id: "onb-siguiente"
- assertVisible: "Elige a qué se dedica tu negocio."
# Elige lo mínimo y avanza al paso 2.
- tapOn:
    id: "onb-tipo-ventas"
- tapOn:
    id: "onb-descripcion"
- inputText: "Vendemos ropa deportiva en Manizales"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "onb-sugerido-Sofía"
    direction: DOWN
- tapOn:
    id: "onb-sugerido-Sofía"
- tapOn:
    id: "onb-siguiente"
- assertVisible: "Paso 2 de 6"
# La tarjeta del agente muestra lo decidido.
- tapOn:
    id: "onb-ver-agente"
- assertVisible: "Sofía"
- pressKey: back
# Lo hace después: confirma y queda el aviso fijo.
- tapOn:
    id: "onb-omitir"
- tapOn: "Lo hago después"
- extendedWaitUntil:
    visible:
      id: "aviso-onboarding"
    timeout: 20000
- assertVisible: "Tu agente aún no está listo para probar. Faltan 5 pasos."
# Lo retoma desde el aviso en el paso donde quedó.
- tapOn:
    id: "aviso-onboarding-continuar"
- extendedWaitUntil:
    visible:
      id: "onboarding-recorrido"
    timeout: 20000
- assertVisible: "Paso 2 de 6"
