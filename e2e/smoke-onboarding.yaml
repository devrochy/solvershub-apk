# Smoke de la bienvenida en 5 estaciones (HU-APP-23, SPEC-49): un dueño de un negocio NUEVO ve la bienvenida
# abrirse sola a pantalla completa, con la franja del escenario, la mini ruta y lo recomendado preelegido
# (Vendo productos, «Laura»). Cambia una opción, vuelve a lo recomendado y la omite con «Seguir después»; queda
# el aviso fijo y la retoma. NO pulsa «Crear a Laura y seguir»: eso crea el agente y no se escriben datos de
# agente en test. Requiere un APK/OTA con HU-APP-23, el backend con HU-AOS-84 y un negocio creado después de
# ONBOARDING_DESDE. Credenciales demo: demo12345.
appId: com.solvershub.apk
---
- launchApp
- assertVisible: "SolversHub"
- tapOn:
    id: "login-usuario"
- inputText: "dueno-nuevo@demo.test"
- tapOn:
    id: "login-password"
- inputText: "demo12345"
- tapOn:
    id: "login-entrar"
# Se abre sola, con la franja del escenario, el logo y la estación 1 de 5.
- extendedWaitUntil:
    visible:
      id: "onboarding-recorrido"
    timeout: 30000
- assertVisible:
    id: "onb-escenario"
- assertVisible:
    id: "logo-horizontal"
- assertVisible: "Paso 1 de 5 · Tu negocio"
# Llega con lo recomendado.
- assertVisible: "Recomendado"
- assertVisible: "Crear a Laura y seguir"
# Cambiar una opción cuenta un cambio; «Usar lo recomendado» vuelve atrás.
- tapOn:
    id: "onb-tipo-agenda"
- assertVisible: ".*1 cambio.*"
- tapOn:
    id: "onb-recomendado-usar"
- assertNotVisible: "Usar lo recomendado"
# El chat de la estación 1 es simulado: responde sin red.
- scrollUntilVisible:
    element:
      id: "vista-previa-quien"
    direction: DOWN
- tapOn:
    id: "vista-previa-quien"
- assertVisible: "Es una vista previa: no le escribe a nadie"
# Lo deja para después: confirma y queda el aviso fijo.
- tapOn:
    id: "onb-omitir"
# El texto también es el del enlace de la franja: se toca el botón del diálogo.
- tapOn:
    text: "Seguir después"
    index: 1
- extendedWaitUntil:
    visible:
      id: "aviso-onboarding"
    timeout: 20000
- assertVisible: "Tu agente aún no está listo para responder. Faltan 5 de 5 pasos."
# La retoma desde el aviso en la estación donde quedó.
- tapOn:
    id: "aviso-onboarding-continuar"
- extendedWaitUntil:
    visible:
      id: "onboarding-recorrido"
    timeout: 20000
- assertVisible: "Paso 1 de 5 · Tu negocio"
