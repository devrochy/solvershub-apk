# Smoke de cobranza en la app oficial (testIDs reales del módulo de campo)
# Contra el APK preview + API de test. Credenciales: demo12345.
# Requiere: dispositivo de prueba ya vinculado/aprobado para el gestor demo.
appId: com.solvershub.apk
---
- launchApp
- assertVisible: "SolversHub"
# 1. Login unificado (panel → exchange de campo)
- tapOn:
    id: "login-usuario"
- inputText: "gestor@demo.test"
- tapOn:
    id: "login-password"
- inputText: "demo12345"
- tapOn:
    id: "login-entrar"
# 2. Selector de negocio (el gestor demo tiene 2)
- assertVisible: "Elige tu negocio"
- tapOn: "Cobranza Demo"
# 3. Campo: el gestor con una sola cartera entra directo a su cartera
- assertVisible: "Información de la cartera"
# 4. Menú lateral → Diario del día
#    Un toque mientras la pantalla termina de montar puede no abrir el menú:
#    se reintenta hasta que aparezca la opción.
- repeat:
    times: 3
    while:
      notVisible: "Diario"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: "btn-menu"
- tapOn: "Diario"
- extendedWaitUntil:
    visible:
      id: "btn-liquidacion"
    timeout: 15000
# 5. Generar trayecto del día (ruta con los clientes con cuota)
- tapOn:
    id: "generar-trayecto"
    optional: true
# 6. Abrir el cliente más cercano (tarjeta de cliente del diario)
- tapOn:
    id: "btn-cliente-cercano"
    optional: true
